# Give the login screen Lindle's colors, accent, font and icons, once.
# The plasmalogin user's home is /var/lib/plasmalogin; "C" copies only if the file is missing,
# so the System Settings login screen page can still override it.
d /var/lib/plasmalogin/.config 0700 plasmalogin plasmalogin - -
C /var/lib/plasmalogin/.config/kdeglobals 0644 plasmalogin plasmalogin - /usr/share/lindle/greeter/kdeglobals
