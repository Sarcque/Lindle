---
name: Build live ISO

# Builds "Lindle Live": an ISO that boots into the Lindle desktop from a USB
# stick, with an "Install Lindle" button. The ISO is built by Titanoboa from
# iso/Containerfile, then booted in a VM for screenshots, which go to the
# "screenshots-live" branch (or "screenshots-live-pr-<number>").
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-live-iso.yml'
      - 'iso/**'
      - 'tests/live-screenshots.sh'
  push:
    tags:
      - 'v*'

concurrency:
  group: live-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and boot the live ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/lindle:latest
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build the live system
        run: |
          sudo podman build --cap-add sys_admin --security-opt label=disable \
            --build-arg IMAGE="$IMAGE" -t localhost/lindle-live:latest iso/
          # titanoboa resolves iso-dest with realpath, which needs the folder.
          mkdir -p output

      - name: Build the ISO
        id: iso
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/lindle-live:latest
          iso-dest: ${{ github.workspace }}/output/lindle-live.iso

      - name: Checksum
        run: |
          # titanoboa resolves iso-dest from its own folder under _actions, so
          # the ISO lands there. Move it to where the next steps expect it.
          actions="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_actions"
          iso="$(find output "$actions/ublue-os/titanoboa" -name lindle-live.iso -print -quit)"
          echo "titanoboa wrote $iso"
          [ "$iso" = output/lindle-live.iso ] || mv "$iso" output/lindle-live.iso
          cd output
          sha256sum lindle-live.iso | tee lindle-live.iso-CHECKSUM
          ls -lh

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf socat imagemagick
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the ISO and take screenshots
        run: tests/live-screenshots.sh output/lindle-live.iso "$RUNNER_TEMP/screenshots"

      - name: Upload the ISO
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lindle-live-iso
          path: output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish screenshots
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && format('screenshots-live-pr-{0}', github.event.pull_request.number) || 'screenshots-live' }}
        run: |
          cd "$RUNNER_TEMP/screenshots"
          {
            echo "# Lindle Live screenshots"
            echo
            for f in *.png; do
              echo "## ${f%.png}"
              echo
              echo "![${f%.png}]($f)"
              echo
            done
          } > README.md
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live ISO screenshots of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:$BRANCH"
