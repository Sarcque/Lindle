---
name: Lint
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint scripts, configs and design tokens
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shellcheck build scripts
        run: |
          find build_files -name '*.sh' -print0 | xargs -0 shellcheck -x

      - name: Validate JSON
        run: |
          find design system_files -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null

      - name: Check the QML apps load
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qml-qt6 qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtquick-shapes
          tests/qml-smoke.sh

      - name: Check color contrast
        run: |
          python3 design/generate.py --check

      - name: Check generated color schemes and icons are up to date
        run: |
          python3 design/generate.py
          git diff --exit-code -- system_files/usr/share/color-schemes system_files/usr/share/icons design/logo system_files/usr/share/lindle/qml system_files/usr/share/lindle/greeter system_files/usr/share/kde-settings/kde-profile/default/xdg/breezerc system_files/usr/share/plasma/desktoptheme
          test -z "$(git ls-files --others --exclude-standard system_files/usr/share/icons design/logo system_files/usr/share/lindle system_files/usr/share/plasma/desktoptheme)"
